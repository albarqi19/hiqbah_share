[php]
extensions = ["gd", "exif", "zip", "pgsql", "pdo_pgsql", "intl", "bcmath", "mbstring", "xml", "curl", "dom", "fileinfo", "tokenizer"]

[deploy]
startCommand = "php artisan config:clear ; php artisan route:clear ; php artisan cache:clear ; php artisan migrate --force ; php artisan db:seed --class=AdminUserSeeder --force ; php artisan serve --host=0.0.0.0 --port=$PORT"
